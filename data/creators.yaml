# Disabled Creators Directory: one entry per creator.
#
# Tables on media/disabled-creators-directory.md and its es/ mirror are generated
# from this file. After editing, run:  python3 scripts/creators_directory.py
# CI fails if the pages don't match this file (--check).
#
# Entry fields:
#   name               string, or {en, es} if it's translated
#   years              "1947-2023" for creators who have died (shown after the name)
#   disability         in the creator's OWN words; {en, es} unless identical
#   non_us             true if based outside the US
#   disclosure_source  public URL where the creator discloses their disability
#                      (required for every new entry)
#   website            creator's main link (not shown in the table yet)
#   verified           date the entry was last checked against its sources
#   legacy             true only for entries listed before the 2026-09-23 sourcing
#                      rule. These still need a disclosure_source; add one and
#                      delete the flag. Never add a new entry as legacy.
#   listings           one per table the creator appears in; each fills that
#                      section's fields (see sections below)
#
# Any text value can be a plain string (same in EN and ES) or {en: ..., es: ...}.

sections:
  - key: fiction
    fields: [genre, work]
    columns:
      en: [Genre/Focus, Notable Work]
      es: [Género/Enfoque, Obra notable]
  - key: nonfiction
    fields: [focus, work]
    columns:
      en: [Focus, Notable Work]
      es: [Enfoque, Obra notable]
  - key: poets
    fields: [style, work]
    columns:
      en: [Style, Notable Work]
      es: [Estilo, Obra notable]
  - key: visual-artists
    fields: [medium, notable_for]
    columns:
      en: [Medium, Notable For]
      es: [Medio, Notable por]
  - key: musicians
    fields: [genre, notable_for]
    columns:
      en: [Genre, Notable For]
      es: [Género, Notable por]
  - key: filmmakers
    fields: [focus, work]
    columns:
      en: [Focus, Notable Work]
      es: [Enfoque, Obra notable]
  - key: screen-actors
    fields: [roles]
    columns:
      en: [Notable Roles]
      es: [Papeles notables]
  - key: theater
    fields: [notable_for]
    columns:
      en: [Notable For]
      es: [Notable por]
  - key: comedians
    fields: [platform, notable_for]
    columns:
      en: [Platform, Notable For]
      es: [Plataforma, Notable por]
  - key: dancers
    fields: [style, notable_for]
    columns:
      en: [Company/Style, Notable For]
      es: [Compañía/Estilo, Notable por]
  - key: podcasters
    fields: [show, focus]
    columns:
      en: [Show, Focus]
      es: [Programa, Enfoque]
  - key: youtubers
    fields: [content]
    columns:
      en: [Content]
      es: [Contenido]
  - key: journalists
    fields: [focus]
    columns:
      en: [Publication/Focus]
      es: [Publicación/Enfoque]
  - key: academics
    fields: [field, institution]
    columns:
      en: [Field, Institution]
      es: [Campo, Institución]
  - key: activists
    fields: [creative_work]
    columns:
      en: [Creative Work]
      es: [Obra creativa]

